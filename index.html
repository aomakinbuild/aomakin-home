<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AO Makin Build</title>
  <meta name="description" content="Licensed general contractor · Riyadh, KSA. Residential, commercial & infrastructure construction." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal: #69a7a2;
      --teal-dark: #4d8a85;
      --teal-light: #e8f4f3;
      --dark: #232323;
      --white: #ffffff;
      --muted: #7a8c8b;
      --bg: #f7fafa;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 20px;
      text-align: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 50% -5%, rgba(105,167,162,0.15) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 90% 110%, rgba(105,167,162,0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 100%;
    }

    /* Logo */
    .logo-mark {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 8px 28px rgba(105,167,162,0.38);
    }

    .logo-mark span {
      color: white;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    /* Brand name */
    .brand-en {
      font-size: 28px;
      font-weight: 700;
      color: var(--dark);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .brand-ar {
      font-size: 18px;
      font-weight: 600;
      color: var(--teal-dark);
      direction: rtl;
      margin-bottom: 24px;
    }

    /* Divider */
    .divider {
      width: 48px;
      height: 3px;
      background: var(--teal);
      border-radius: 2px;
      margin: 0 auto 24px;
    }

    /* Tagline */
    .tagline-en {
      font-size: 17px;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .tagline-ar {
      font-size: 16px;
      font-weight: 500;
      color: var(--muted);
      direction: rtl;
      margin-bottom: 28px;
    }

    /* Category */
    .category {
      display: inline-block;
      background: var(--teal-light);
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 32px;
    }

    /* Coming soon badge */
    .soon-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--dark);
      color: var(--white);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 24px;
      margin-bottom: 32px;
    }

    .soon-dot {
      width: 7px;
      height: 7px;
      background: var(--teal);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Social row */
    .social-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--white);
      border: 1px solid rgba(105,167,162,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .social-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(105,167,162,0.22);
    }

    .social-btn svg {
      width: 20px;
      height: 20px;
    }

    /* Contact */
    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--teal-dark);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      border-bottom: 1px solid rgba(105,167,162,0.4);
      padding-bottom: 2px;
      transition: color 0.15s;
      margin-bottom: 40px;
    }

    .contact-link:hover { color: var(--dark); }

    /* Footer */
    .footer {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.8;
    }
  </style>
</head>
